spring.application.name=money-controll

# Database: in development the PostgreSQL container from compose.yaml is started and wired automatically.
# Elsewhere set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Accept ISO dates (yyyy-MM-dd) in query parameters.
spring.mvc.format.date=iso
spring.data.web.pageable.max-page-size=100
